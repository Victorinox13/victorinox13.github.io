<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Astroleck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1c33"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ed7ff"/>
      <stop offset="1" stop-color="#4cbcff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- orbit -->
  <ellipse cx="32" cy="34" rx="21" ry="8.5" fill="none" stroke="url(#ring)" stroke-width="3"
           transform="rotate(-24 32 34)"/>
  <!-- planet -->
  <circle cx="32" cy="34" r="10" fill="#f4f7fb"/>
  <circle cx="32" cy="34" r="10" fill="none" stroke="#4cbcff" stroke-width="1.5" opacity="0.5"/>
  <!-- star -->
  <path d="M48 13 L49.8 18.2 L55 20 L49.8 21.8 L48 27 L46.2 21.8 L41 20 L46.2 18.2 Z" fill="#ffd36e"/>
</svg>
